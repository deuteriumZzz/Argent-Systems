<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a19"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a78d6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2a78d6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1baf7a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- faint gridlines -->
  <g stroke="#2c2c2a" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- abstract equity-curve motif, right side -->
  <g opacity="0.55">
    <path d="M 650 230 L 700 210 L 740 220 L 780 170 L 820 185 L 860 130 L 900 145 L 940 95 L 980 110 L 1020 70 L 1060 85 L 1100 45 L 1150 55"
          fill="none" stroke="url(#lineGlow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 650 230 L 700 210 L 740 220 L 780 170 L 820 185 L 860 130 L 900 145 L 940 95 L 980 110 L 1020 70 L 1060 85 L 1100 45 L 1150 55 L 1150 300 L 650 300 Z"
          fill="url(#lineGlow)" opacity="0.08"/>
  </g>

  <!-- candlesticks, subtle, far right -->
  <g opacity="0.35">
    <rect x="700" y="195" width="6" height="30" fill="#1baf7a"/>
    <rect x="740" y="205" width="6" height="20" fill="#e34948"/>
    <rect x="780" y="160" width="6" height="35" fill="#1baf7a"/>
    <rect x="860" y="120" width="6" height="30" fill="#1baf7a"/>
    <rect x="940" y="85" width="6" height="25" fill="#1baf7a"/>
    <rect x="1020" y="60" width="6" height="25" fill="#1baf7a"/>
    <rect x="1100" y="40" width="6" height="20" fill="#1baf7a"/>
  </g>

  <text x="70" y="115" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#ffffff">Argent Systems</text>
  <text x="70" y="155" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#c3c2b7">Крипто-торговые стратегии: собраны, забэктестены, статистически честно проверены</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#898781">
    <text x="70" y="200">132 стратегии</text>
    <text x="220" y="200">·</text>
    <text x="240" y="200">11 рыночных режимов (2017–2025)</text>
    <text x="510" y="200">·</text>
    <text x="530" y="200">Deflated Sharpe Ratio</text>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#52514e">
    <text x="70" y="250">grid · dca · trend · reversion · carry · on-chain · cross-exchange · smart-money-concepts</text>
  </g>
</svg>
